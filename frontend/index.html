<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgoCert</title>
</head>

<body>

    <h1>AlgoCert</h1>
    <h2>Blockchain-Based Certificate Verification System</h2>

    <hr>

    <h3>Register Certificate</h3>

    <form id="registerForm">

        <label>Student Name:</label><br>
        <input type="text" id="studentName" required>
        <br><br>

        <label>Course:</label><br>
        <input type="text" id="course" required>
        <br><br>

        <label>Certificate:</label><br>
        <input type="file" id="certificate" required>
        <br><br>

        <button type="submit">Register Certificate</button>

    </form>

    <div id="registerResult"></div>

    <hr>

    <h3>Verify Certificate</h3>

    <form id="verifyForm">

        <label>Certificate ID:</label><br>
        <input type="text" id="certificateId" required>
        <br><br>

        <label>Certificate:</label><br>
        <input type="file" id="verifyCertificate" required>
        <br><br>

        <button type="submit">Verify Certificate</button>

    </form>

    <div id="verifyResult"></div>
    <script src="script.js"></script>

</body>
</html>
